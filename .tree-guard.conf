# mrp-paper's declaration for the host guards and the host ship queue
# (mellowmarshall/devtools#92). The guards bind every mellowmarshall repo with
# no declaration needed; this file only adds.
base_ref=origin/main

# --- How mrp-paper ships ---
# The host ship queue reads these keys at one origin/main sha per job and
# runs scripts/ship/ship-steps.sh as committed there. The house stages (the
# host's secret scan and its 500-line size ratchet) run in every ship.
ship_repo=mrp-paper
ship_gh_repo=mellowmarshall/mrp-paper
ship_worktree_root=/data/Dev/mrp-paper
ship_body_check=scripts/ship/ship-steps.sh body
# The CI: mrp-paper has no tests; the step parses its Python.
ship_ci=scripts/ship/ship-steps.sh ci
ship_merge=scripts/ship/ship-steps.sh merge
